name: Publish Desktop Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installer
        run: npm run electron:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odyseus-${{ matrix.os }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: odyseus-*
          path: artifacts

      - name: Stage installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -iname '*.AppImage' -o -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-assets/
          done
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -lt 3 ]; then
            echo "Expected installers from Linux, Windows, and macOS; found only $count."
            find artifacts -type f -print
            exit 1
          fi
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          echo "Release files:"
          ls -lh release-assets

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Odyseus Nexus Pro ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
