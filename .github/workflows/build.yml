name: Build Desktop (Electron)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build each target on its native runner. electron-builder cannot
# cross-compile Linux packages from Windows/macOS, so a matrix
# over OSes is the only reliable way to ship a .exe, .dmg AND
# a Linux AppImage/.deb from one repo.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install deps. No secrets required: desktop build does not
      # need Firebase/Gemini env vars at build time.
      - name: Install dependencies
        run: npm ci

      - name: Build desktop app for this OS
        run: npm run electron:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: odyseus-${{ matrix.os }}
          path: release/
          if-no-files-found: warn
